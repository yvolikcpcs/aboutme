name: Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggers

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      # Ensure this script exists in package.json (see step 2)
      - name: Type Check
        run: npm run type-check

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # These are needed during build time for Next.js SSG
          NEXT_PUBLIC_NAME: ${{ vars.NEXT_PUBLIC_NAME }}
          NEXT_PUBLIC_ROLE: ${{ vars.NEXT_PUBLIC_ROLE }}
          NEXT_PUBLIC_LOCATION: ${{ vars.NEXT_PUBLIC_LOCATION }}
          NEXT_PUBLIC_EMAIL: ${{ vars.NEXT_PUBLIC_EMAIL }}
          NEXT_PUBLIC_PHONE: ${{ vars.NEXT_PUBLIC_PHONE }}
          NEXT_PUBLIC_LINKEDIN: ${{ vars.NEXT_PUBLIC_LINKEDIN }}
          NEXT_PUBLIC_GITHUB: ${{ vars.NEXT_PUBLIC_GITHUB }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}